[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-ml"
version = "0.1.0"
description = "Model ML (Linear Regression) przewidujący ceny mieszkań we Wrocławiu"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.1.0",
    "mlflow>=2.0.0",
]

[tool.setuptools]
# Płaskie moduły; model.pkl leży obok ml.py (instalacja editable w workspace)
py-modules = ["ml", "ml_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
