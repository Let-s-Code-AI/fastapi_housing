[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-housing"
version = "0.1.0"
description = "API FastAPI do przewidywania cen mieszkań we Wrocławiu (dane z Adresowo.pl)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.1.0",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "sqlalchemy>=1.4.0",
    "pydantic>=1.8.0",
    "mlflow>=2.0.0",
]

[tool.setuptools]
# Płaski układ modułów w katalogu głównym (bez pakietu)
py-modules = ["main", "models", "database", "ml", "ml_flow", "create_db"]
