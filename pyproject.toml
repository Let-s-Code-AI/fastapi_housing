# Wirtualny root uv workspace – sam nie jest pakietem.
# Instalacja całości: uv sync --all-packages

[tool.uv.workspace]
members = ["services/api", "services/ml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "mutmut>=3.3.1",
    "ruff>=0.17.4",
]

# Lint dla całego repo (lokalnie i w CI): uv run ruff check .
# Jawna konfiguracja, żeby globalny ruff.toml użytkownika nie zmieniał wyniku.
[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
